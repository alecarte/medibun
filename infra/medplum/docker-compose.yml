# Self-hosted Medplum stack for LOCAL DEV ONLY. Based on Medplum's official
# docker-compose.full-stack.yml, pinned to 5.1.9 (server/app) for reproducibility — NOT 5.1.13,
# which has a SubscriptionQueue backoff regression that breaks bot execution.
# Production will use Medplum Cloud (see docs/ARCHITECTURE.md). Synthetic data only — never
# put real PHI in this local instance, and never expose it on a public network.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "statement_timeout=60000"
      - "-c"
      - "default_transaction_isolation=REPEATABLE READ"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medplum", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medplum-server:
    image: medplum/medplum-server:5.1.9
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8103:8103"
    command: ["env"]
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: "http://localhost:8103/"
      MEDPLUM_APP_BASE_URL: "http://localhost:3000/"
      MEDPLUM_STORAGE_BASE_URL: "http://localhost:8103/storage/"
      MEDPLUM_DATABASE_HOST: "postgres"
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: "medplum"
      MEDPLUM_DATABASE_USERNAME: "medplum"
      MEDPLUM_DATABASE_PASSWORD: "medplum"
      MEDPLUM_REDIS_HOST: "redis"
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: "medplum"
      MEDPLUM_BINARY_STORAGE: "file:./binary/"
      MEDPLUM_SUPPORT_EMAIL: '"Medplum" <support@medplum.com>'
      MEDPLUM_MAX_JSON_SIZE: "1mb"
      MEDPLUM_MAX_BATCH_SIZE: "50mb"
      # Bots run in-process via VM context locally (no AWS Lambda). NOT a security sandbox —
      # fine for trusted local dev only.
      MEDPLUM_BOT_LAMBDA_ROLE_ARN: ""
      MEDPLUM_BOT_LAMBDA_LAYER_NAME: "medplum-bot-layer"
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: "true"
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: "vmcontext"
      MEDPLUM_ALLOWED_ORIGINS: "*"
      # AuditEvents on RESTful interactions (docs/AUTH.md attribution requirement).
      # Emitted to the server log; prod (Medplum Cloud) needs log streaming enabled by Medplum.
      MEDPLUM_LOG_AUDIT_EVENTS: "true"
      MEDPLUM_INTROSPECTION_ENABLED: "true"
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
      # Dev only: the 5.1.9 default is 5 logins/min/IP (ratelimit.ts `defaultLoginRateLimit`),
      # which the seed + demo (patient, front desk, clinician in quick succession) would trip.
      # Prod (Medplum Cloud) instead needs the project `loginRateLimit` raised — AUTH.md checklist.
      MEDPLUM_DEFAULT_LOGIN_RATE_LIMIT: 1000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  medplum-app:
    image: medplum/medplum-app:5.1.9
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Dev only: the app image's docker-entrypoint.sh defaults RECAPTCHA_SITE_KEY to
      # Medplum CLOUD's site key, which our server (no recaptcha configured) rejects on
      # /auth/newuser with "Invalid recaptchaSiteKey". Empty key = recaptcha skipped on
      # both sides (v5.1.9 NewUserForm.tsx + server auth/utils.ts validateRecaptcha).
      # Local synthetic-data stack only; prod is Medplum Cloud with its own recaptcha.
      RECAPTCHA_SITE_KEY: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The BFF's experience database (ADR-0002: Neon in prod; plain Postgres for local dev).
  # Separate service from Medplum's postgres to keep the two-stores boundary physical.
  experience-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medibun
      - POSTGRES_PASSWORD=medibun
      - POSTGRES_DB=medibun_experience
    ports:
      - "5433:5432"
    volumes:
      - experience-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibun -d medibun_experience"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medplum-postgres-data:
  experience-postgres-data:
